name: CI/CD Pipeline - Backend Anime Quiz

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. Calidad de Código y Validación de Python
  # ==========================================
  code-quality:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validar sintaxis y compilación de Python
        run: |
          python -m py_compile main.py database.py models.py schemas.py security.py

      - name: Análisis estático con Flake8 (Warnings / Syntax errors)
        run: |
          # Detiene la ejecución si hay errores de sintaxis de Python o nombres no definidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Advertencias de estilo (no bloqueante)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # ==========================================
  # 2. Construcción y Verificación de Docker
  # ==========================================
  docker-build:
    name: Docker Build & Compose Check
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Validar configuración de docker-compose.yml
        run: |
          docker compose config

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker de prueba
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: animequiz-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 3. Publicación de Imagen Docker a Docker Hub
  # ==========================================
  docker-publish:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: docker-build
    # Se ejecuta en push a la rama principal
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'alesisxhz' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generar metadatos de Docker (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'alesisxhz' }}/animequiz-backend
          tags: |
            type=raw,value=latest
            type=raw,value=v1.0
            type=sha,format=short

      - name: Construir y publicar imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # 4. Despliegue Automático en AWS EC2 (CD)
  # ==========================================
  deploy:
    name: Continuous Deployment to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Conectar por SSH y Desplegar
        if: env.EC2_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST || '3.144.45.172' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Iniciando despliegue en servidor..."
            cd /home/ubuntu/app
            git pull origin main
            sudo docker compose pull app
            sudo docker compose up -d --remove-orphans app
            sudo docker system prune -f
            echo "Esperando inicio del servicio para verificación de salud..."
            sleep 5
            curl -f http://127.0.0.1:8000/api/health || exit 1
            echo "¡Despliegue automático completado exitosamente!"
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}



